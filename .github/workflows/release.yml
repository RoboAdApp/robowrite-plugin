name: Release

# Runs on every push to main. When the version in server.json has no vX.Y.Z tag
# yet, it publishes server.json to the Official MCP Registry, then tags the
# commit and creates the GitHub release. A push without a version bump is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  REGISTRY_DOMAIN: robowrite.ai
  REGISTRY_NAME: ai.robowrite/mcp

jobs:
  detect:
    name: Detect unreleased version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Only main can release
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases run from main, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Manifests must be valid and agree on one version
        run: python3 scripts/validate_manifests.py

      - name: Compare the manifest version with existing tags
        id: version
        run: |
          version=$(jq -r .version server.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${version}" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v${version} is already tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 2 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v${version}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::could not list tags (git ls-remote exit ${status})"
            exit 1
          fi

  publish-registry:
    name: Publish to MCP Registry
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Skip if this version is already in the registry
        id: existing
        run: |
          version="$VERSION"
          found=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${REGISTRY_NAME}&version=${version}" \
            | jq --arg name "$REGISTRY_NAME" --arg version "$version" \
              '[(.servers // [])[] | select(.server.name == $name and .server.version == $version)] | length')
          if ! [[ "$found" =~ ^[0-9]+$ ]]; then
            echo "::error::registry version lookup did not return a count (got '${found}')"
            exit 1
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      # DNS auth: the matching public key is a TXT record on the robowrite.ai apex.
      - name: Log in with the domain key
        if: steps.existing.outputs.found == '0'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the mcp-registry environment"
            exit 1
          fi
          ./mcp-publisher login dns --domain "$REGISTRY_DOMAIN" --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        if: steps.existing.outputs.found == '0'
        run: ./mcp-publisher publish

      - name: Verify the registry serves this version
        env:
          ALREADY_PUBLISHED: ${{ steps.existing.outputs.found }}
        run: |
          version="$VERSION"
          if ! [[ "$ALREADY_PUBLISHED" =~ ^[0-9]+$ ]]; then
            echo "::error::registry version lookup did not return a count"
            exit 1
          fi
          if [ "$ALREADY_PUBLISHED" -ne 0 ]; then
            echo "Registry already has ${version}; skipping latest check so re-runs stay idempotent"
            echo "Registry already has ${version}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest=""
          for _ in 1 2 3 4 5; do
            latest=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${REGISTRY_NAME}" \
              | jq -r --arg name "$REGISTRY_NAME" \
                '(.servers // [])[] | select(.server.name == $name and ._meta["io.modelcontextprotocol.registry/official"].isLatest) | .server.version')
            if [ "$latest" = "$version" ]; then
              echo "Registry latest is ${latest}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::registry latest is '${latest}', expected ${version}"
          exit 1

  github-release:
    name: Tag and GitHub release
    needs: [detect, publish-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Creates the vX.Y.Z tag on the released commit along with the release.
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.detect.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi
