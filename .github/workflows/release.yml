name: Release

# Runs on every push to main. For the version in server.json, it publishes to
# the Official MCP Registry if the registry lacks it, then creates the vX.Y.Z
# tag and GitHub release if they are missing. A push without a version bump,
# once that version is fully released, is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  REGISTRY_DOMAIN: robowrite.ai
  REGISTRY_NAME: ai.robowrite/mcp

jobs:
  detect:
    name: Detect unreleased version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Only main can release
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases run from main, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Manifests must be valid and agree on one version
        run: python3 scripts/validate_manifests.py

      # The registry entry and the GitHub release are checked separately, so a
      # partial release is completed instead of skipped.
      - name: Check what is already published and released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(scripts/release_state.sh)
          echo "$state" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Release state"
            echo
            while IFS= read -r line; do echo "    ${line}"; done <<<"$state"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-registry:
    name: Publish to MCP Registry
    needs: detect
    if: needs.detect.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Skip if this version is already in the registry
        id: existing
        run: |
          version="$VERSION"
          found=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${REGISTRY_NAME}&version=${version}" \
            | jq --arg name "$REGISTRY_NAME" --arg version "$version" \
              '[(.servers // [])[] | select(.server.name == $name and .server.version == $version)] | length')
          if ! [[ "$found" =~ ^[0-9]+$ ]]; then
            echo "::error::registry version lookup did not return a count (got '${found}')"
            exit 1
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      # DNS auth: the matching public key is a TXT record on the robowrite.ai apex.
      - name: Log in with the domain key
        if: steps.existing.outputs.found == '0'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the mcp-registry environment"
            exit 1
          fi
          ./mcp-publisher login dns --domain "$REGISTRY_DOMAIN" --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        if: steps.existing.outputs.found == '0'
        run: ./mcp-publisher publish

      - name: Verify the registry serves this version
        env:
          ALREADY_PUBLISHED: ${{ steps.existing.outputs.found }}
        run: |
          version="$VERSION"
          if ! [[ "$ALREADY_PUBLISHED" =~ ^[0-9]+$ ]]; then
            echo "::error::registry version lookup did not return a count"
            exit 1
          fi
          if [ "$ALREADY_PUBLISHED" -ne 0 ]; then
            echo "Registry already has ${version}; skipping latest check so re-runs stay idempotent"
            echo "Registry already has ${version}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest=""
          for _ in 1 2 3 4 5; do
            latest=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${REGISTRY_NAME}" \
              | jq -r --arg name "$REGISTRY_NAME" \
                '(.servers // [])[] | select(.server.name == $name and ._meta["io.modelcontextprotocol.registry/official"].isLatest) | .server.version')
            if [ "$latest" = "$version" ]; then
              echo "Registry latest is ${latest}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::registry latest is '${latest}', expected ${version}"
          exit 1

  github-release:
    name: Tag and GitHub release
    needs: [detect, publish-registry]
    # Runs after a successful publish, or on its own when the registry already
    # has this version but the release is missing. Never after a failed publish.
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.detect.outputs.released == 'false'
      && (needs.publish-registry.result == 'success' || needs.publish-registry.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Creates the vX.Y.Z tag on the released commit along with the release.
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.detect.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # --target is ignored when the tag already exists, so a leftover tag
            # on another commit would publish that commit. Refuse that.
            # Look up the git ref first: commits/{tag} returns 422 (not 404)
            # when the tag is absent, which is not "not found".
            ref_status=0
            ref_err=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .ref 2>&1) || ref_status=$?
            if [ "$ref_status" -eq 0 ]; then
              tagged_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
              if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
                echo "::error::$TAG points to $tagged_sha, expected $GITHUB_SHA"
                exit 1
              fi
            elif [[ "$ref_err" == *"Not Found"* ]] || [[ "$ref_err" == *"404"* ]]; then
              echo "$TAG does not exist yet; creating it on $GITHUB_SHA"
            else
              echo "::error::could not look up $TAG: $ref_err"
              exit 1
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi
